<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayFlow Checkout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.checkout {
  width: 100%;
  max-width: 460px;
}

.brand {
  text-align: center;
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.secure {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 22px;
}

.payment-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 8px;
}

.description {
  color: #6b7280;
  line-height: 1.5;
  margin-bottom: 20px;
}

.summary {
  background: #f3f4f6;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 22px;
}

.summary-label {
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 5px;
}

.amount {
  font-size: 34px;
  font-weight: bold;
}

.section-title {
  font-size: 17px;
  font-weight: bold;
  margin: 24px 0 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 15px;
  margin-bottom: 16px;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

.card-row {
  display: flex;
  gap: 10px;
}

.card-row > div {
  flex: 1;
}

.payment-icons {
  display: flex;
  gap: 7px;
  margin-bottom: 18px;
}

.payment-icon {
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 11px;
  font-weight: bold;
  background: white;
}

.pay-button {
  width: 100%;
  padding: 15px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 6px;
}

.pay-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  text-align: center;
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.5;
}

.error {
  color: #dc2626;
}

.success {
  color: #16a34a;
}

.notice {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  border-radius: 9px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.4;
  margin-top: 16px;
}

.footer {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="checkout">

  <div class="brand">
    PayFlow
  </div>

  <div class="card">

    <div class="secure">
      🔒 Secure Checkout
    </div>

    <div class="payment-title" id="title">
      Loading payment...
    </div>

    <div class="description" id="description"></div>

    <div class="summary">

      <div class="summary-label">
        Amount to pay
      </div>

      <div class="amount" id="amount">
        $0.00
      </div>

    </div>

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      autocomplete="email"
    >

    <div class="section-title">
      Payment Method
    </div>

    <div class="payment-icons">
      <div class="payment-icon">VISA</div>
      <div class="payment-icon">MC</div>
      <div class="payment-icon">AMEX</div>
      <div class="payment-icon">APPLE PAY</div>
      <div class="payment-icon">G PAY</div>
    </div>

    <label for="cardName">
      Cardholder Name
    </label>

    <input
      type="text"
      id="cardName"
      placeholder="Name on card"
      autocomplete="cc-name"
    >

    <label for="cardNumber">
      Card Number
    </label>

    <input
      type="text"
      id="cardNumber"
      placeholder="1234 5678 9012 3456"
      inputmode="numeric"
      autocomplete="off"
      maxlength="19"
    >

    <div class="card-row">

      <div>
        <label for="expiry">
          Expiration
        </label>

        <input
          type="text"
          id="expiry"
          placeholder="MM/YY"
          inputmode="numeric"
          autocomplete="off"
          maxlength="5"
        >
      </div>

      <div>
        <label for="cvv">
          CVV
        </label>

        <input
          type="password"
          id="cvv"
          placeholder="123"
          inputmode="numeric"
          autocomplete="off"
          maxlength="4"
        >
      </div>

    </div>

    <button
      class="pay-button"
      id="payButton"
      onclick="continuePayment()"
    >
      Pay Now
    </button>

    <div
      class="notice"
    >
      This is a payment interface preview.
      Card information is not processed or stored yet.
    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>

  <div class="footer">
    Powered by PayFlow
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://qfmczhdnmbntjfioyzjc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vyPMYAngU34c2YHkTjt_ZA_MVet1HmZ";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const params =
  new URLSearchParams(
    window.location.search
  );

const slug =
  params.get("slug");

let paymentLink = null;

let paymentSubmitting = false;


async function loadPaymentLink() {

  if (!slug) {

    document.getElementById("title").textContent =
      "Invalid Payment Link";

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("payment_links")
      .select("*")
      .eq("slug", slug)
      .eq("active", true)
      .single();

  if (error || !data) {

    document.getElementById("title").textContent =
      "Payment Link Not Found";

    return;
  }

  paymentLink = data;

  document.getElementById("title").textContent =
    data.title;

  document.getElementById("description").textContent =
    data.description || "";

  document.getElementById("amount").textContent =
    "$" + Number(data.amount).toFixed(2);
}


async function continuePayment() {

  if (paymentSubmitting) {
    return;
  }

  const email =
    document.getElementById("email").value.trim();

  const cardName =
    document.getElementById("cardName").value.trim();

  const cardNumber =
    document.getElementById("cardNumber").value.trim();

  const expiry =
    document.getElementById("expiry").value.trim();

  const cvv =
    document.getElementById("cvv").value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("payButton");


  if (!email) {

    message.className =
      "message error";

    message.textContent =
      "Please enter your email address.";

    return;
  }


  if (!cardName || !cardNumber || !expiry || !cvv) {

    message.className =
      "message error";

    message.textContent =
      "Please complete all card fields.";

    return;
  }


  if (!paymentLink) {

    message.className =
      "message error";

    message.textContent =
      "Payment link is unavailable.";

    return;
  }


  paymentSubmitting = true;

  button.disabled = true;

  button.textContent =
    "Processing...";


  /*
    IMPORTANT:
    Card details are NOT sent to Supabase.
    They are only used for this interface preview.
  */

  const { data, error } =
    await supabaseClient
      .from("payments")
      .insert({

        payment_link_id:
          paymentLink.id,

        user_id:
          paymentLink.user_id,

        amount:
          paymentLink.amount,

        currency:
          "USD",

        status:
          "pending",

        customer_email:
          email

      })
      .select()
      .single();


  if (error) {

    console.error(error);

    paymentSubmitting = false;

    button.disabled = false;

    button.textContent =
      "Pay Now";

    message.className =
      "message error";

    message.textContent =
      "Unable to create payment. Please try again.";

    return;
  }


  message.className =
    "message success";

  message.innerHTML =
    "Payment request created successfully.<br>" +
    "Your payment is currently pending.";

  button.textContent =
    "Payment Created";

}


loadPaymentLink();

</script>

</body>
</html>
