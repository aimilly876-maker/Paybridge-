<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow Payment</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .amount {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

<div class="card">
  <h1 id="title">Loading...</h1>

  <p id="description"></p>

  <div class="amount" id="amount">$0.00</div>

  <label for="email">Customer Email</label>

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
  >

  <button id="payButton" onclick="continuePayment()">
    Continue to Payment
  </button>

  <p id="message"></p>
</div>

<script>
  const SUPABASE_URL =
    "https://qfmczhdnmbntjfioyzjc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vyPMYAngU34c2YHkTjt_ZA_MVet1HmZ";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const params = new URLSearchParams(
    window.location.search
  );

  const slug = params.get("slug");

  let paymentLink = null;

  async function loadPaymentLink() {

    if (!slug) {
      document.getElementById("title").textContent =
        "Invalid Payment Link";
      return;
    }

    const { data, error } = await supabaseClient
      .from("payment_links")
      .select("*")
      .eq("slug", slug)
      .eq("active", true)
      .single();

    if (error || !data) {
      document.getElementById("title").textContent =
        "Payment Link Not Found";
      return;
    }

    paymentLink = data;

    document.getElementById("title").textContent =
      data.title;

    document.getElementById("description").textContent =
      data.description || "";

    document.getElementById("amount").textContent =
      "$" + Number(data.amount).toFixed(2);
  }

  async function continuePayment() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("payButton");

    if (!email) {
      message.className = "error";
      message.textContent =
        "Please enter your email.";
      return;
    }

    if (!paymentLink) {
      message.className = "error";
      message.textContent =
        "Payment link is unavailable.";
      return;
    }

    button.disabled = true;
    button.textContent = "Creating Payment...";

    const { data, error } = await supabaseClient
      .from("payments")
      .insert({
        payment_link_id: paymentLink.id,
        user_id: paymentLink.user_id,
        amount: paymentLink.amount,
        currency: "USD",
        status: "pending",
        customer_email: email
      })
      .select()
      .single();

    if (error) {

      console.error(error);

      message.className = "error";
      message.textContent =
        "Unable to create payment: " + error.message;

      button.disabled = false;
      button.textContent =
        "Continue to Payment";

      return;
    }

    message.className = "success";

    message.textContent =
      "Payment created successfully. Payment ID: " +
      data.id;

    button.textContent =
      "Payment Created";
  }

  loadPaymentLink();
</script>

</body>
</html>
