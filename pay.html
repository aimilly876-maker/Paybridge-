<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow Checkout</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%, rgba(77, 110, 255, .25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0, 220, 180, .18), transparent 32%),
        linear-gradient(135deg, #050816 0%, #0a1024 50%, #03050c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .shell {
      width: 100%;
      max-width: 500px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      background: linear-gradient(135deg, #6d7cff, #3ee7c2);
    }

    .brand-name {
      font-size: 25px;
      font-weight: 800;
    }

    .secure {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 13px;
    }

    .checkout {
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(10, 16, 35, .76);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }

    .merchant {
      color: #8ea0c2;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .description {
      color: #9aa8c0;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .amount-box {
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 22px;
      background: linear-gradient(
        135deg,
        rgba(109,124,255,.14),
        rgba(62,231,194,.07)
      );
      border: 1px solid rgba(255,255,255,.08);
    }

    .amount-label {
      color: #91a0bb;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .amount {
      margin-top: 5px;
      font-size: 35px;
      font-weight: 850;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(255,255,255,.10);
      outline: none;
      border-radius: 14px;
      padding: 14px 15px;
