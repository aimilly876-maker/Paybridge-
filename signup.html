<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow - Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #111827;
    }

    p {
      text-align: center;
      color: #6b7280;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Create your PayFlow account</h1>
    <p>For merchants and customers who want a PayFlow account.</p>

    <form id="signupForm">

      <input
        type="text"
        id="fullName"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        minlength="6"
        required
      >

      <button type="submit" id="signupButton">
        Create Account
      </button>

      <div class="message" id="message"></div>

    </form>

    <a href="login.html">Already have an account? Log in</a>
    <a href="index.html">Back to PayFlow</a>
  </div>

  <script>
    const SUPABASE_URL = "https://qfmczhdnmbntjfioyzjc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vyPMYAngU34c2YHkTjt_ZA_MVet1HmZ";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      message.textContent = "";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Create Account";
        return;
      }

      if (data.user) {
        message.textContent =
          "Account created! Check your email to confirm your account.";

        form.reset();
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
