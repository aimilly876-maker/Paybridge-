<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PayFlow Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #logoutButton {
      background: white;
      color: #111827;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .amount {
      font-size: 25px;
      font-weight: bold;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 25px;
    }

    .menu button {
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      cursor: pointer;
      font-size: 15px;
    }

    .transactions {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .empty {
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>PayFlow</h1>
  <button id="logoutButton">Log Out</button>
</header>

<div class="container">

  <div class="welcome">
    <h2>Dashboard</h2>
    <p id="userEmail">Checking your account...</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Balance</h3>
      <div class="amount">$0.00</div>
    </div>

    <div class="card">
      <h3>Total Received</h3>
      <div class="amount">$0.00</div>
    </div>

    <div class="card">
      <h3>Transactions</h3>
      <div class="amount">0</div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div class="amount">$0.00</div>
    </div>

  </div>

  <div class="menu">

    <button onclick="alert('Payment links coming next.')">
      🔗 Payment Links
    </button>

    <button onclick="alert('Invoices coming soon.')">
      🧾 Invoices
    </button>

    <button onclick="alert('Payouts coming soon.')">
      💸 Payouts
    </button>

    <button onclick="alert('Transactions coming soon.')">
      📊 Transactions
    </button>

    <button onclick="alert('Settings coming soon.')">
      ⚙️ Settings
    </button>

  </div>

  <div class="transactions">

    <h2>Recent Transactions</h2>

    <p class="empty">
      You don't have any transactions yet.
    </p>

  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://qfmczhdnmbntjfioyzjc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_vyPMYAngU34c2YHkTjt_ZA_MVet1HmZ";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkUser() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    document.getElementById("userEmail").textContent =
      "Logged in as " + user.email;
  }

  document
    .getElementById("logoutButton")
    .addEventListener("click", async function () {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

    });

  checkUser();

</script>

</body>
</html>
