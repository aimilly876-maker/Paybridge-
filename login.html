<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow — Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #667085;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
<div class="logo">PayFlow</div>
<div class="card">
  <h1>Welcome back</h1>
  <p class="subtitle">
    Sign in to access your payment dashboard.
  </p>
  <form onsubmit="login(event)">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >
    <button type="submit">
      Sign In
    </button>
  </form>
  <div class="links">
    Don't have an account?
    <a href="signup.html">Create one</a>
  </div>
  <a href="index.html" class="back">
    ← Back to home
  </a>
</div>
  </div>
  <script>
    function login(event) {
      event.preventDefault();
      alert(
        "Login is not connected to a real account system yet. We will connect the secure authentication system in the next step."
      );
    }
  </script>
</body>
</html>
