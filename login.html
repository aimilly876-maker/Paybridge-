<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayFlow - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #111827;
    }

    p {
      text-align: center;
      color: #6b7280;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome Back</h1>
    <p>Log in to your PayFlow account</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" id="loginButton">
        Log In
      </button>

      <div class="message" id="message"></div>

    </form>

    <a href="signup.html">Don't have an account? Create one</a>
    <a href="index.html">Back to PayFlow</a>
  </div>

  <script>
    const SUPABASE_URL = "https://qfmczhdnmbntjfioyzjc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vyPMYAngU34c2YHkTjt_ZA_MVet1HmZ";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Logging in...";
      message.textContent = "";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Log In";
        return;
      }

      message.textContent = "Login successful!";

      setTimeout(function() {
        window.location.href = "dashboard.html";
      }, 500);
    });
  </script>

</body>
</html>
